<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f7b6c2;

            font-family: Georgia, serif;

            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 900px;

            background: #fff7f8;

            border-radius: 30px;

            padding: 40px;

            display: flex;
            align-items: center;

            gap: 45px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.18);

            animation: cardIn 1.2s ease forwards;
        }

        /* Card animation */

        @keyframes cardIn {

            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* Photo */

        .photo-box {
            width: 330px;
            height: 400px;

            flex-shrink: 0;

            border-radius: 25px;

            overflow: hidden;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);

            animation: photoIn 1.5s ease 0.3s both;
        }

        .photo-box img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transition: transform 0.5s ease;
        }

        .photo-box:hover img {
            transform: scale(1.05);
        }


        /* Text */

        .text {
            color: #5c3b43;

            animation: textIn 1.5s ease 0.8s both;
        }

        .text h1 {
            color: #c2185b;

            font-size: 38px;

            margin-bottom: 25px;
        }

        .text p {
            font-size: 21px;

            line-height: 1.8;

            margin-bottom: 25px;
        }


        /* Text animation */

        @keyframes textIn {

            from {
                opacity: 0;
                transform: translateX(50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }

        }


        /* Photo animation */

        @keyframes photoIn {

            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        /* Heart */

        .heart {
            font-size: 35px;

            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {

            50% {
                transform: scale(1.2);
            }

        }


        /* Mobile */

        @media (max-width: 750px) {

            .card {
                flex-direction: column;

                text-align: center;

                padding: 30px;

                gap: 30px;
            }

            .photo-box {
                width: 240px;
                height: 300px;
            }

            .text h1 {
                font-size: 30px;
            }

            .text p {
                font-size: 17px;
            }

        }

    </style>

</head>


<body>

    <div class="card">

        <!-- PHOTO -->

        <div class="photo-box">

            <img src="photo3.jpeg" alt="Birthday Photo">

        </div>


        <!-- WISH -->

        <div class="text">

            <h1>For You ❤️</h1>

            <p>
                If I could wish one thing for you today,
                it would be that every happiness you deserve
                finds its way to you.
                May your days be filled with beautiful moments
                and genuine smiles.
            </p>

            <p>
                Happy Birthday to my loved one,
                who makes ordinary moments feel a little more special. ❤️
            </p>

            <div class="heart">
                💕
            </div>

        </div>

    </div>

</body>

</html>
