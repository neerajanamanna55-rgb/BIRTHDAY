<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Birthday Wish ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f7b6c2;

            font-family: Georgia, serif;

            padding: 25px;
        }

        .wish-card {
            width: 100%;
            max-width: 750px;

            background: #fff7f8;

            border-radius: 30px;

            padding: 35px;

            display: flex;
            align-items: center;
            gap: 35px;

            box-shadow: 0 15px 40px rgba(0,0,0,0.18);

            animation: cardIn 1.2s ease forwards;
        }

        @keyframes cardIn {

            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* Photo */

        .photo-box {
            width: 270px;
            height: 330px;

            flex-shrink: 0;

            border-radius: 20px;

            overflow: hidden;

            animation: photoIn 1.3s ease .4s both;
        }

        .photo-box img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        @keyframes photoIn {

            from {
                opacity: 0;
                transform: scale(.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        /* Wish */

        .wish-text {
            color: #5c3b43;

            animation: textIn 1.5s ease .8s both;
        }

        .wish-text h1 {
            color: #c2185b;

            font-size: 38px;

            margin-bottom: 20px;
        }

        .wish-text p {
            font-size: 20px;

            line-height: 1.7;

            margin-bottom: 15px;
        }

        .heart {
            font-size: 35px;

            margin-top: 10px;

            animation: heartbeat 1s infinite;
        }

        @keyframes textIn {

            from {
                opacity: 0;
                transform: translateX(40px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }

        }

        @keyframes heartbeat {

            50% {
                transform: scale(1.2);
            }

        }


        /* Mobile */

        @media (max-width: 650px) {

            .wish-card {
                flex-direction: column;

                text-align: center;

                padding: 25px;
            }

            .photo-box {
                width: 220px;
                height: 270px;
            }

            .wish-text h1 {
                font-size: 30px;
            }

            .wish-text p {
                font-size: 17px;
            }

        }
        .next-btn {
    display: inline-block;

    margin-top: 20px;

    padding: 12px 24px;

    background: #c2185b;
    color: white;

    text-decoration: none;

    border-radius: 25px;

    transition: .3s;
}

.next-btn:hover {
    transform: scale(1.08);
}
    </style>
    
</head>


<body>

    <div class="wish-card">

        <!-- PHOTO -->

        <div class="photo-box">

            <img src="photo.jpeg" alt="Birthday Photo">

        </div>


        <!-- WISH -->

        <div class="wish-text">

            <h1>Happy Birthday My Dear ❤️</h1>

            <p>
                Wish you a many many happy returns of the day...
            </p>

            <p>
                Stay well, stay healthy.<br>
                God bless you. ❤️
            </p>

            <div class="heart">
                💕
            </div>

        </div>
        <a href="page3.html" class="next-btn">One More Surprise 💌</a>
    </div>
</body>

</html>
